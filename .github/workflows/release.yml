name: Release

# A release is one tag push on a commit whose Cargo.toml (and Cargo.lock) has
# that version:
#
#   git tag -a v1.2.3 -m "v1.2.3" && git push origin v1.2.3
#
# The shared pipeline (zentinelproxy/.github, agent-release.yml) refuses a tag
# that does not match Cargo.toml, builds every platform from the tag with
# --locked, runs scripts/smoke-test.sh behind the latest Zentinel release on
# each, and publishes zentinel-image-optimization-agent-<version>-<platform>.tar.gz (+ .sha256),
# the names `zentinel bundle install` downloads, only if all of them pass. It
# never replaces an existing release. Running it by hand is a dry run.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: zentinelproxy/.github/.github/workflows/agent-release.yml@v1
    with:
      binary: zentinel-image-optimization-agent
      # zentinel-agent-protocol is a path dependency on ../zentinel. Pin the
      # commit Cargo.lock was generated against, so the tag always builds the
      # same thing; bump it together with Cargo.lock.
      siblings: zentinelproxy/zentinel@3bcfe23e98c126112ba232182d1619c5491e1015
      # AVIF encoding (rav1e) needs nasm.
      apt-packages: protobuf-compiler nasm
      brew-packages: protobuf nasm
      smoke-command: scripts/smoke-test.sh
      harness-ref: v1
