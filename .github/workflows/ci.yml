name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - uses: actions/checkout@v6
      - name: Clone zentinel
        run: git clone --depth 1 https://github.com/zentinelproxy/zentinel.git ../zentinel
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler nasm
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - uses: actions/checkout@v6
      - name: Clone zentinel
        run: git clone --depth 1 https://github.com/zentinelproxy/zentinel.git ../zentinel
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler nasm
      - run: cargo test --workspace

  # The release pipeline on one platform, without publishing: builds the
  # release binary with --locked and runs scripts/smoke-test.sh behind the
  # latest Zentinel release, so a change that would break a release fails
  # here first.
  smoke:
    name: Smoke
    uses: zentinelproxy/.github/.github/workflows/agent-release.yml@v1
    permissions:
      contents: read
    with:
      binary: zentinel-image-optimization-agent
      # zentinel-agent-protocol is a path dependency on ../zentinel. Pin the
      # commit Cargo.lock was generated against, so the tag always builds the
      # same thing; bump it together with Cargo.lock.
      siblings: zentinelproxy/zentinel@3bcfe23e98c126112ba232182d1619c5491e1015
      # AVIF encoding (rav1e) needs nasm.
      apt-packages: protobuf-compiler nasm
      brew-packages: protobuf nasm
      smoke-command: scripts/smoke-test.sh
      harness-ref: v1
      platforms: '["linux-x86_64"]'
      cache: true
